    :root { color-scheme: dark; font-family: system-ui, sans-serif; }

<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>BYTE BACK 내 자료실은 인터넷에 연결되어 있을 때만 쓸 수 있습니다.</p>
    <ul>
      <li>메모는 서버(Supabase)에만 있고 이 기기에 저장해 두지 않으므로, 오프라인에서는 메모를 볼 수도, 저장할 수도 없습니다.</li>
      <li>앱을 설치했어도 로그인과 기기 승인은 연결된 뒤 서버와 반 엔진이 다시 확인합니다. 설치만으로 기기 확인이 끝나지 않습니다.</li>
    </ul>
    <p>연결을 확인한 뒤 <a href="/">자료실로 돌아가기</a>를 누르세요.</p>
